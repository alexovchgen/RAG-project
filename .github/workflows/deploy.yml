name: Deploy

on:
  workflow_run:                # стартуем, когда отработал другой workflow
    workflows: [CI]            # имя из строки name: в ci.yml
    types: [completed]         # в момент, когда CI закончил работу
    branches: [main]           # и только если это был main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CI закончился — но чем? Едем на сервер только если зелёным
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Prepare image name
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER_LOWER/rag-servise" >> $GITHUB_ENV

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ${{ env.IMAGE }}:latest

            docker network create rag-net 2>/dev/null || true

            docker rm -f task-api rag-servise 2>/dev/null || true

            docker run -d \
              --name rag-servise \
              --network rag-net \
              --restart unless-stopped \
              -p 127.0.0.1:8000:8000 \
              -e LOG_LEVEL=INFO \
              -e LLM_API_KEY="${{ secrets.LLM_API_KEY }}" \
              -e QDRANT_URL=http://qdrant:6333 \
              ${{ env.IMAGE }}:latest

            # lifespan грузит e5: контейнер running ≠ /health готов
            ok=0
            for i in $(seq 1 36); do
              if curl -sf http://127.0.0.1:8000/health >/dev/null; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "Сервис не ответил на /health"
              docker ps -a --filter name=rag-servise
              docker logs --tail 80 rag-servise
              docker logout ghcr.io
              exit 1
            fi

            docker image prune -f
            docker logout ghcr.io