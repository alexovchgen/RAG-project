name: Deploy

on:
  workflow_run:                # стартуем, когда отработал другой workflow
    workflows: [CI]            # имя из строки name: в ci.yml
    types: [completed]         # в момент, когда CI закончил работу
    branches: [main]           # и только если это был main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CI закончился — но чем? Едем на сервер только если зелёным
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Prepare image name
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER_LOWER/rag-servise" >> $GITHUB_ENV

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # команды ниже выполняются НА сервере
            # логинимся в реестр, чтобы стянуть приватный образ
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # тянем образ, который CI уже собрал и проверил тестами
            docker pull ${{ env.IMAGE }}:latest

            # сеть должна совпадать с ручным контейнером qdrant на VPS
            docker network create rag-net 2>/dev/null || true

            # сносим старый контейнер (прежнее имя task-api и текущее rag-servise)
            docker rm -f task-api rag-servise 2>/dev/null || true

            # поднимаем новый в фоне
            docker run -d \
              --name rag-servise \
              --network rag-net \
              --restart unless-stopped \
              -p 127.0.0.1:8000:8000 \
              -e LOG_LEVEL=INFO \
              -e LLM_API_KEY="${{ secrets.LLM_API_KEY }}" \
              -e QDRANT_URL=http://qdrant:6333 \
              ${{ env.IMAGE }}:latest

            # убеждаемся, что контейнер действительно жив, и только тогда чистим диск
            sleep 5
            if [ -n "$(docker ps -q -f name=rag-servise -f status=running)" ]; then
              docker image prune -f
            else
              echo "Контейнер не поднялся"
              docker logs --tail 50 rag-servise
              exit 1
            fi

            docker logout ghcr.io